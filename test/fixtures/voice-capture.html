<!doctype html><html data-theme="dark"><head><meta charset="UTF-8"><title>Isolated synthetic dictation</title></head><body><div id="root" class="composer composer-voice-active" style="margin:80px;width:800px"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import '/src/styles.css';
import {VoiceInput} from '/src/components/VoiceInput.tsx';import {store} from '/src/state/store.ts';
const records=[];const Real=MediaRecorder;window.MediaRecorder=new Proxy(Real,{get(C,k){if(k==='isTypeSupported')return format=>format==='audio/mp4'&&Real.isTypeSupported(format);return Reflect.get(C,k);},construct(C,args){const recorder=new C(...args),info={mime:recorder.mimeType,bytes:0};records.push(info);recorder.addEventListener('dataavailable',e=>info.bytes+=e.data.size);return recorder;}});
const originalFetch=window.fetch.bind(window);window.fetch=(url,options)=>String(url).endsWith('/fixture/audio/transcriptions')?Promise.resolve(new Response(JSON.stringify({text:'Проверка диктовки'}),{headers:{'Content-Type':'application/json'}})):originalFetch(url,options);
let context,called=false;
navigator.mediaDevices.getUserMedia=async()=>{called=true;context=new AudioContext();await context.resume();const destination=context.createMediaStreamDestination(),oscillator=context.createOscillator(),gain=context.createGain();gain.gain.value=.15;oscillator.frequency.value=210;oscillator.connect(gain).connect(destination);oscillator.start();return destination.stream;};
store.state.activeSessionId='isolated-native-voice';store.state.directory='/tmp/isolated-voice';store.state.prefs.asr={endpoint:location.origin+'/fixture/audio/transcriptions',model:'fixture',language:'ru'};
createRoot(document.getElementById('root')).render(React.createElement(VoiceInput,{disabled:false}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));const until=async(test)=>{const deadline=Date.now()+12000;while(!test()){if(Date.now()>deadline)throw Error('timeout: '+document.body.innerText);await wait(30);}};
let result;
try {
 await until(()=>document.querySelector('[aria-label="Надиктовать"]'));document.querySelector('[aria-label="Надиктовать"]').click();await wait(150);
 if(document.querySelector('.voice-ready'))throw Error('Ready before first checkpoint');
 await until(()=>document.querySelector('.voice-ready'));
 if(!called||!records[0]?.bytes)throw Error('No synthetic checkpoint');
 await wait(400);const a=document.querySelector('canvas').toDataURL();await wait(55);const b=document.querySelector('canvas').toDataURL();if(a===b)throw Error('Wave frozen');
 document.querySelector('[aria-label="Закончить и распознать"]').click();await until(()=>document.querySelector('[aria-label="Надиктовать"]'));
 result={pass:!document.querySelector('[role="alert"]'),calledSynthetic:called,records,text:store.getDraft()};
} catch(e) { result={pass:false,error:String(e),records,calledSynthetic:called}; }
await context?.close();window.fixtureNativeResult=result;if(window.webkit?.messageHandlers?.result)window.webkit.messageHandlers.result.postMessage(result);
</script></body></html>
