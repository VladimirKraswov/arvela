<!doctype html><html data-theme="dark"><head><meta charset="UTF-8"><title>Isolated correction rendering</title></head><body><div id="root" style="max-width:800px;margin:40px auto;padding:20px"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import '/src/styles.css';
import {UserMessageView} from '/src/components/render.tsx';import {store} from '/src/state/store.ts';import {emptySessionChat} from '/src/state/chatReducer.ts';
store.isRunning=()=>true;store.isPiSession=()=>false;
const chat=emptySessionChat();store.state.chat.sessions.fixture=chat;
const messages=['Исправь управление и проверь тесты.','При проверке учти также управление стрелками.'].map((text,i)=>{
 const id='u'+i,pid='p'+i;chat.partsByMessage[id]=[pid];chat.parts[pid]={id:pid,messageID:id,sessionID:'fixture',type:'text',text,...(i?{metadata:{arvelaSteering:1}}:{})};
 return {id,sessionID:'fixture',role:'user',time:{created:Date.now()}};
});
createRoot(document.getElementById('root')).render(React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:'24px'}},messages.map(message=>React.createElement(UserMessageView,{key:message.id,message}))));
</script></body></html>
